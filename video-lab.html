<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Lab — Pace Lab</title>
<meta name="description" content="Mark splits from your race video and compare pacing to elite models. Runs entirely in your browser.">
<meta property="og:title" content="Video Lab — Pace Lab">
<meta property="og:description" content="Client-side race video timing and pacing analysis.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pace.alphapeak.io/video-lab.html">
<meta property="og:site_name" content="Pace Lab">
<meta property="og:image" content="https://pace.alphapeak.io/apeak.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="AlphaPeak — Pace Lab">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pace.alphapeak.io/apeak.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="vl-page-hero" data-vl-chrome>
  <a class="alphapeak-brand" href="https://alphapeak.io" target="_blank" rel="noopener noreferrer" aria-label="AlphaPeak — alphapeak.io">
    <img src="/apeak.png" alt="AlphaPeak" width="160" height="40" decoding="async">
  </a>
  <h1 class="vl-page-title">Video Lab</h1>
</div>

<nav class="nav" data-vl-chrome>
  <a href="/" style="padding:8px 16px;color:var(--accent);font-weight:600">← Home</a>
  <span class="nav-divider" aria-hidden="true"></span>
  <a href="/pace-lab.html" style="padding:8px 16px;color:var(--text2);font-weight:500">Pace Lab</a>
</nav>

<div class="container video-lab-wrap">

  <section class="vl-panel" data-vl-step="upload" data-vl-chrome>
    <h2 class="vl-h2">Race video</h2>
    <div class="vl-upload-zone" id="vl-upload-zone" role="button" tabindex="0" aria-label="Add video file">
      <input type="file" id="vl-file" accept="video/*" class="vl-sr-only" aria-label="Choose video file">
      <div id="vl-upload-placeholder" class="vl-upload-placeholder">
        <div class="vl-upload-icon" aria-hidden="true"></div>
        <p class="vl-upload-title">Add video</p>
        <p class="vl-upload-line">Drop a file or tap</p>
      </div>
      <div id="vl-upload-preview" class="vl-upload-preview" hidden>
        <video id="vl-upload-preview-video" class="vl-upload-preview-video" playsinline controls></video>
        <button type="button" class="vl-upload-change" id="vl-upload-change">Replace</button>
      </div>
    </div>
  </section>

  <section class="vl-panel" data-vl-step="event" hidden data-vl-chrome>
    <h2 class="vl-h2">Event</h2>
    <div class="vl-row">
      <label class="vl-label">Event</label>
      <select id="vl-event" class="vl-select"></select>
    </div>
    <div class="vl-row">
      <label class="vl-label">Gender</label>
      <select id="vl-gender" class="vl-select">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
    <div class="vl-nav-row">
      <button type="button" class="vl-btn-ghost" id="vl-btn-event-back">Back</button>
      <button type="button" class="vl-btn-primary" id="vl-btn-event-next">Continue</button>
    </div>
  </section>

  <div class="vl-workbench" id="vl-workbench" hidden>
    <div class="vl-stage">
      <div class="vl-stage__media">
        <div class="vl-video-wrap">
          <video id="vl-video" playsinline tabindex="0" class="vl-video"></video>
        </div>
        <div class="vl-controls">
          <button type="button" id="vl-ctl-play" class="vl-ctl-btn vl-ctl-play" aria-label="Play / pause">
            <span class="vl-ctl-play-icon" aria-hidden="true"></span>
          </button>
          <button type="button" id="vl-ctl-back" class="vl-ctl-btn vl-ctl-nudge" aria-label="Back one frame" title="Back 0.05s (←)">−</button>
          <input type="range" id="vl-scrubber" class="vl-scrubber" min="0" max="0" step="0.01" value="0" aria-label="Scrub video">
          <button type="button" id="vl-ctl-fwd" class="vl-ctl-btn vl-ctl-nudge" aria-label="Forward one frame" title="Forward 0.05s (→)">+</button>
          <span id="vl-ctl-time" class="vl-ctl-time mono">0:00</span>
        </div>
      </div>

      <aside class="vl-rail" id="vl-rail">
        <header class="vl-rail__head">
          <span class="vl-rail__head-k">Race</span>
          <span class="vl-clock" id="vl-race-clock">—</span>
        </header>

        <div class="vl-rail__body">
          <div class="vl-rail__step" data-vl-step="gun" hidden>
            <button type="button" class="vl-tap-btn" id="vl-btn-set-gun" aria-label="Set gun at current video time">SET GUN</button>
            <p class="vl-rail__hint">Scrub to the start, then tap.</p>
            <button type="button" class="vl-rail__back-link" id="vl-btn-gun-back">← Event</button>
          </div>

          <div class="vl-rail__step" data-vl-step="splits" hidden>
            <button type="button" class="vl-tap-btn vl-tap-btn--accent" id="vl-btn-mark-split" aria-label="Mark split">MARK</button>
            <p class="vl-rail__progress" id="vl-split-progress">—</p>
            <ul class="vl-splits-list" id="vl-splits-list"></ul>
            <div class="vl-rail__row">
              <button type="button" class="vl-rail__back-link" id="vl-btn-splits-back">← Gun</button>
              <button type="button" class="vl-rail__back-link" id="vl-btn-undo-split">Undo</button>
            </div>
          </div>

          <div class="vl-rail__step vl-rail__step--form" data-vl-step="official" hidden>
            <p class="vl-strong" id="vl-official-summary">—</p>
            <div class="vl-row">
              <label class="vl-label">Official time (optional)</label>
              <input type="text" id="vl-official-time" class="vl-input vl-input--dock" placeholder="e.g. 47.12 or 3:42.50">
            </div>
            <div class="vl-row vl-radio-row vl-radio-row--compact">
              <label><input type="radio" name="vl-reconcile" id="vl-reconcile-scale" checked> Scale to official</label>
              <label><input type="radio" name="vl-reconcile" id="vl-reconcile-raw"> Keep raw</label>
            </div>
            <div class="vl-row">
              <label class="vl-label">Label (optional)</label>
              <input type="text" id="vl-athlete-label" class="vl-input vl-input--dock" placeholder="Name or note">
            </div>
            <div class="vl-nav-row vl-nav-row--pair">
              <button type="button" class="vl-btn-ghost" id="vl-btn-official-back">Back</button>
              <button type="button" class="vl-btn-primary" id="vl-btn-official-next">Run analysis</button>
            </div>
          </div>
        </div>

        <div class="vl-rail__foot">
          <label class="vl-missed-check-label">
            <input type="checkbox" id="vl-missed-enable" class="vl-missed-enable">
            Recording started late
          </label>
          <div class="vl-missed-details" id="vl-missed-details" hidden>
            <input type="number" id="vl-missed-head" class="vl-input vl-missed-input" min="0" step="0.05" value="0" placeholder="seconds before gun frame">
          </div>
        </div>
      </aside>
    </div>
  </div>

  <section class="vl-panel" data-vl-step="analysis" hidden data-vl-chrome>
    <h2 class="vl-h2">Analysis</h2>
    <p id="vl-anchor-strip" class="vl-anchor-strip mono" aria-label="Your segment times in seconds"></p>
    <div id="vl-dash-cards" class="vl-dash-cards" aria-live="polite"></div>
    <h3 class="vl-gap-h">Gap vs reference</h3>
    <div id="vl-gap-viz" class="vl-gap-viz" aria-label="Gap vs model by segment"></div>
    <div class="vl-chart-meter-wrap">
      <aside class="vl-pace-meter" aria-label="Reference finish time — faster or slower">
        <span class="vl-pace-hot">Faster</span>
        <input type="range" id="vl-pace-target" class="vl-pace-target-range" min="0" max="100" value="50" step="1" orient="vertical" aria-valuetext="Reference curve target" title="Faster (top) vs slower (bottom).">
        <span class="vl-pace-cold">Slower</span>
        <div id="vl-pace-readout" class="vl-pace-readout"></div>
      </aside>
      <div class="vl-chart-wrap vl-chart-wrap--metered">
        <canvas id="vl-chart" height="320"></canvas>
      </div>
    </div>
    <div id="vl-analysis-table" class="vl-table-wrap"></div>
    <div class="vl-nav-row vl-nav-row--analysis-actions">
      <button type="button" class="vl-btn-primary" id="vl-btn-share-link">Save &amp; copy share link</button>
      <button type="button" class="vl-btn-ghost" id="vl-btn-analysis-restart">Start over</button>
    </div>
    <div id="vl-share-result" class="vl-share-result" hidden>
      <p class="vl-copy vl-share-result-msg" id="vl-share-result-msg"></p>
      <div class="vl-share-url-row">
        <input type="text" readonly class="vl-input vl-share-url-input" id="vl-share-url" autocomplete="off" spellcheck="false" aria-label="Share link">
        <button type="button" class="vl-btn-primary" id="vl-btn-copy-url-manual">Copy link</button>
      </div>
    </div>
  </section>

</div>

<footer data-vl-chrome>
  <a class="alphapeak-brand" href="https://alphapeak.io" target="_blank" rel="noopener noreferrer" aria-label="AlphaPeak — alphapeak.io">
    <img src="/apeak.png" alt="AlphaPeak" width="140" height="35" decoding="async">
  </a>
  <p class="vl-footer-copy">Pace Lab · Video stays on this device · <a href="https://alphapeak.io" target="_blank" rel="noopener noreferrer">alphapeak.io</a> · <a href="/">Home</a></p>
</footer>

<script type="module">
import { initVideoLab } from '/src/js/video-lab/app.js';
initVideoLab();
</script>
</body>
</html>
